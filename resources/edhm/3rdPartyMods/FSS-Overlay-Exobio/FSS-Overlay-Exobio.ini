;------------------------------------------------------------------------------------------------------
; FSS Exobio Overlay, by EDSSI
;
; Marks the bands of the Filtered Spectral Analysis where bodies that can have life show up:
; Metal Rich, High Metal Content, Rocky, Icy and Rocky Ice.
;
; It draws through the shaders installed by the FSS Overlay Mod (psychicEgg and Parduz, maintained
; by Fred89210), which must be in ShaderFixes. Both hook the same shaders, so only one of the two
; can be in 3rdPartyMods at a time.
;------------------------------------------------------------------------------------------------------
[Constants]
; Set while the FSS is on screen. Don't edit.
global $FSSexobioOn = 0
;
; 0 = off at startup, 1 = on at startup
global $FSSexobioEnabled = 1
;
; Overlay brightness. Default = 1, can be > 1
w6 = 1

;------------------------------------------------------------------------------------------------------
[KeyToggle-FSS-Exobio-Enabled]
; Turns the overlay on and off. 0x8f = no key.
Key = 0x8f
type = cycle
$FSSexobioEnabled = 0, 1

;------------------------------------------------------------------------------------------------------
; Don't edit anything below this line
;------------------------------------------------------------------------------------------------------
[ShaderOverride-FSS-Exobio-Background]
; FSS background: its shader only runs while the FSS is open
hash = 85464878a444a6a6
allow_duplicate_hash = overrule
Preset = FSSExobioOn

[PresetFSSExobioOn]
$FSSexobioOn = 1

[ShaderOverride-FSS-Exobio-Ultra-High]
; FSS, ultra high quality
hash = d6c6b9abdf104b6d
if $FSSexobioEnabled == 1 && $FSSexobioOn == 1
    ps-t2 = ResourceFSSExobio
endif

[ShaderOverride-FSS-Exobio-Medium]
; FSS, medium quality
hash = 1d5a317f0e831e9d
if $FSSexobioEnabled == 1 && $FSSexobioOn == 1
    ps-t2 = ResourceFSSExobio
endif

[ShaderOverride-FSS-Exobio-Low]
; FSS, low quality
hash = 04fc7f00bade5b4a
if $FSSexobioEnabled == 1 && $FSSexobioOn == 1
    ps-t2 = ResourceFSSExobio
endif

[ShaderOverride-FSS-Exobio-GUI-Disabled]
; FSS, gui disabled quality
hash = ea5390a2f20c2368
if $FSSexobioEnabled == 1 && $FSSexobioOn == 1
    ps-t2 = ResourceFSSExobio
endif

[ResourceFSSExobio]
filename = EDHM-ini\3rdPartyMods\FSS-Overlay-Exobio\Textures\FSS-Overlay-Exobio.png
